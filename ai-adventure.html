<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI提问大冒险 - 小学生版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

:root {
  --pink: #FF6B9D;
  --pink-light: #FFE0EB;
  --purple: #9B59B6;
  --purple-light: #E8DAEF;
  --blue: #5DADE2;
  --blue-light: #D4E6F1;
  --yellow: #F7DC6F;
  --yellow-light: #FEF9E7;
  --green: #58D68D;
  --green-light: #D5F5E3;
  --orange: #F39C12;
  --orange-light: #FCF3CF;
  --red: #EC7063;
  --bg-main: #FFF5F8;
  --card-bg: #FFFFFF;
  --text-dark: #2C3E50;
  --text-muted: #7F8C8D;
  --star-color: #FFD700;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
  background: var(--bg-main);
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== 背景动画 ===== */
.bg-decoration {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.star-particle {
  position: absolute;
  width: 6px; height: 6px;
  background: var(--pink);
  border-radius: 50%;
  opacity: 0.3;
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.5); }
}

.cloud {
  position: absolute;
  background: white;
  border-radius: 100px;
  opacity: 0.15;
  animation: floatCloud 20s linear infinite;
}

@keyframes floatCloud {
  from { transform: translateX(-200px); }
  to { transform: translateX(calc(100vw + 200px)); }
}

/* ===== 主容器 ===== */
.app-container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  min-height: 100vh;
}

/* ===== 头部 ===== */
.game-header {
  text-align: center;
  padding: 24px 16px 20px;
  animation: headerPopIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes headerPopIn {
  0% { opacity: 0; transform: translateY(-30px) scale(0.9); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.game-title {
  font-size: clamp(28px, 7vw, 42px);
  background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 4px;
  margin-bottom: 8px;
  filter: drop-shadow(2px 2px 0 rgba(255,107,157,0.2));
}

.game-subtitle {
  font-size: 16px;
  color: var(--text-muted);
  letter-spacing: 2px;
}

/* ===== 状态栏 ===== */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: var(--card-bg);
  border-radius: 20px;
  border: 3px solid var(--pink-light);
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(255,107,157,0.08);
  animation: slideUp 0.6s ease-out 0.2s both;
}

@keyframes slideUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

.status-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
}

.status-icon {
  width: 32px; height: 32px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.exp-bar-wrap {
  flex: 1;
  max-width: 180px;
}

.exp-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}

.exp-bar {
  height: 14px;
  background: #EEE;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--orange), var(--yellow));
  border-radius: 10px;
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.exp-fill::after {
  content: '';
  position: absolute;
  top: 2px; left: 6px; right: 6px;
  height: 4px;
  background: rgba(255,255,255,0.4);
  border-radius: 3px;
}

.level-badge {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: white;
  padding: 6px 14px;
  border-radius: 12px;
  font-size: 13px;
  white-space: nowrap;
  animation: badgePulse 2s ease-in-out infinite;
}

@keyframes badgePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ===== 关卡选择 ===== */
level-select {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.level-card {
  background: var(--card-bg);
  border-radius: 18px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  border: 3px solid #EEE;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
  animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.level-card:nth-child(1) { animation-delay: 0.3s; }
.level-card:nth-child(2) { animation-delay: 0.4s; }
.level-card:nth-child(3) { animation-delay: 0.5s; }
.level-card:nth-child(4) { animation-delay: 0.6s; }
.level-card:nth-child(5) { animation-delay: 0.7s; }

@keyframes cardPop {
  0% { opacity: 0; transform: scale(0.7) rotate(-3deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.level-card:hover:not(.locked) {
  transform: translateY(-6px) scale(1.03);
  border-color: var(--pink);
  box-shadow: 0 8px 25px rgba(255,107,157,0.2);
}

.level-card.locked {
  cursor: not-allowed;
  opacity: 0.55;
}

.level-card.completed {
  border-color: var(--green);
  background: linear-gradient(135deg, white, var(--green-light));
}

.level-card.current {
  border-color: var(--orange);
  background: linear-gradient(135deg, white, var(--orange-light));
  animation: currentGlow 2s ease-in-out infinite;
}

@keyframes currentGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(243,156,18,0.3); }
  50% { box-shadow: 0 0 20px 5px rgba(243,156,18,0.15); }
}

.level-num {
  width: 44px; height: 44px;
  border-radius: 50%;
  margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, var(--pink), var(--purple));
}

.level-card.completed .level-num {
  background: linear-gradient(135deg, var(--green), #27AE60);
}

.level-card.locked .level-num {
  background: #CCC;
}

.level-name {
  font-size: 14px;
  margin-bottom: 4px;
  color: var(--text-dark);
}

.level-star {
  font-size: 16px;
  letter-spacing: 2px;
}

.level-card.locked .lock-icon {
  font-size: 22px;
  margin-top: 4px;
}

/* ===== 游戏区域 ===== */
game-area {
  display: block;
  background: var(--card-bg);
  border-radius: 24px;
  border: 3px solid var(--pink-light);
  padding: 28px 24px;
  min-height: 400px;
  box-shadow: 0 8px 30px rgba(155,89,182,0.08);
  animation: gameAreaIn 0.5s ease-out both;
}

@keyframes gameAreaIn {
  0% { opacity: 0; transform: translateY(20px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* 角色对话 */
.character-section {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
}

.mascot-avatar {
  width: 80px; height: 80px;
  flex-shrink: 0;
  animation: mascotBounce 2s ease-in-out infinite;
}

@keyframes mascotBounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  25% { transform: translateY(-6px) rotate(2deg); }
  75% { transform: translateY(-3px) rotate(-1deg); }
}

.speech-bubble {
  flex: 1;
  background: linear-gradient(135deg, var(--purple-light), var(--pink-light));
  border-radius: 18px;
  padding: 16px 20px;
  position: relative;
  font-size: 15px;
  line-height: 1.8;
  border: 2px solid var(--purple);
  animation: bubbleIn 0.4s ease-out both;
}

.speech-bubble::before {
  content: '';
  position: absolute;
  left: -12px; top: 24px;
  border: 8px solid transparent;
  border-right-color: var(--purple);
}

@keyframes bubbleIn {
  0% { opacity: 0; transform: translateX(-10px) scale(0.95); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}

/* 场景卡片 */
.scene-card {
  background: linear-gradient(135deg, var(--yellow-light), #FFF8E1);
  border: 3px dashed var(--orange);
  border-radius: 18px;
  padding: 18px 20px;
  margin-bottom: 20px;
  position: relative;
}

.scene-tag {
  display: inline-block;
  background: var(--orange);
  color: white;
  font-size: 12px;
  padding: 3px 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  font-weight: bold;
}

.scene-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-dark);
}

/* 问题区域 */
.question-area {
  margin-bottom: 20px;
}

.question-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white;
  padding: 6px 16px;
  border-radius: 12px;
  font-size: 14px;
  margin-bottom: 14px;
  font-weight: bold;
}

.question-text {
  font-size: 17px;
  font-weight: bold;
  line-height: 1.7;
  color: var(--text-dark);
  margin-bottom: 18px;
  padding: 12px 16px;
  background: var(--blue-light);
  border-radius: 14px;
  border-left: 5px solid var(--blue);
}

/* 选项 */
.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.option-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  background: white;
  border: 3px solid #E8E8E8;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-family: inherit;
  font-size: 15px;
  text-align: left;
  color: var(--text-dark);
  line-height: 1.6;
}

.option-btn:hover {
  border-color: var(--pink);
  background: var(--pink-light);
  transform: translateX(6px);
}

.option-btn.selected-correct {
  border-color: var(--green);
  background: var(--green-light);
  animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.option-btn.selected-wrong {
  border-color: var(--red);
  background: #FDEDEC;
  animation: wrongShake 0.4s ease-in-out;
}

@keyframes correctPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.option-letter {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold;
  font-size: 16px;
  color: white;
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--pink), var(--purple));
}

.option-btn:hover .option-letter {
  background: linear-gradient(135deg, var(--purple), var(--blue));
}

/* 反馈信息 */
.feedback-box {
  margin-top: 18px;
  padding: 16px 20px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.7;
  animation: feedbackIn 0.35s ease-out both;
  display: none;
}

.feedback-box.show { display: block; }

.feedback-correct {
  background: var(--green-light);
  border: 2px solid var(--green);
  color: #1E8449;
}

.feedback-wrong {
  background: #FDEDEC;
  border: 2px solid var(--red);
  color: #C0392B;
}

@keyframes feedbackIn {
  0% { opacity: 0; transform: translateY(10px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* 操作按钮 */
.action-row {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  justify-content: center;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: white;
  border: none;
  padding: 14px 32px;
  border-radius: 16px;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-weight: bold;
  letter-spacing: 1px;
  border: 3px solid transparent;
}

.btn-primary:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 8px 25px rgba(155,89,182,0.35);
  border-color: rgba(255,255,255,0.3);
}

.btn-primary:active {
  transform: translateY(0) scale(0.98);
}

.btn-secondary {
  background: white;
  color: var(--purple);
  border: 3px solid var(--purple);
  padding: 12px 26px;
  border-radius: 14px;
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s ease;
  font-weight: bold;
}

.btn-secondary:hover {
  background: var(--purple-light);
  transform: translateY(-2px);
}

/* ===== 通关画面 ===== */
.victory-screen {
  text-align: center;
  padding: 30px 20px;
  display: none;
}

.victory-screen.show { display: block; animation: victoryIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

@keyframes victoryIn {
  0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
  60% { transform: scale(1.05) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.victory-trophy {
  font-size: 72px;
  animation: trophySpin 1s ease-in-out infinite alternate;
  display: inline-block;
}

@keyframes trophySpin {
  from { transform: rotate(-10deg) scale(1); }
  to { transform: rotate(10deg) scale(1.1); }
}

.victory-title {
  font-size: 28px;
  background: linear-gradient(135deg, var(--orange), var(--pink), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 16px 0 8px;
  font-weight: bold;
}

.victory-stars {
  font-size: 36px;
  letter-spacing: 8px;
  margin: 12px 0;
}

.victory-msg {
  font-size: 16px;
  color: var(--text-muted);
  line-height: 1.8;
  margin-bottom: 20px;
}

/* 徽章收集 */
.badge-collection {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
  padding: 16px;
  background: linear-gradient(135deg, #FFF9C4, #FFECB3);
  border-radius: 18px;
  border: 2px dashed var(--orange);
}

.badge-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  background: white;
  border-radius: 14px;
  border: 2px solid #EEE;
  min-width: 90px;
  transition: all 0.3s ease;
}

.badge-item.unlocked {
  border-color: var(--gold);
  background: linear-gradient(135deg, #FFFEF0, #FFF8DC);
  animation: badgeShine 3s ease-in-out infinite;
}

.badge-item.locked-badge {
  opacity: 0.4;
  filter: grayscale(1);
}

@keyframes badgeShine {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
  50% { box-shadow: 0 0 15px 3px rgba(255,215,0,0.3); }
}

.badge-icon { font-size: 28px; }
.badge-name { font-size: 11px; color: var(--text-muted); }
.badge-item.unlocked .badge-name { color: var(--orange); font-weight: bold; }

/* ===== 总通关 ===== */
.all-clear-screen {
  text-align: center;
  padding: 40px 20px;
  display: none;
}

.all-clear-screen.show { display: block; animation: victoryIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

.final-title {
  font-size: clamp(24px, 6vw, 38px);
  background: linear-gradient(45deg, #FF6B9D, #9B59B6, #5DADE2, #58D68D, #F7DC6F, #FF6B9D);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: rainbowShift 3s linear infinite;
  margin-bottom: 16px;
}

@keyframes rainbowShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

.final-mascot {
  width: 120px; height: 120px;
  margin: 0 auto 20px;
  animation: finalBounce 1.5s ease-in-out infinite;
}

@keyframes finalBounce {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  33% { transform: translateY(-15px) rotate(5deg); }
  66% { transform: translateY(-5px) rotate(-3deg); }
}

.final-message {
  font-size: 17px;
  line-height: 2;
  color: var(--text-dark);
  max-width: 500px;
  margin: 0 auto 24px;
}

.confetti-container {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
  display: none;
}

.confetti-container.show { display: block; }

.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== 响应式 ===== */
@media (max-width: 600px) {
  .app-container { padding: 12px 10px 30px; }
  .status-bar { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .exp-bar-wrap { max-width: 100%; order: 3; width: 100%; }
  level-select { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  game-area { padding: 20px 16px; }
  .character-section { flex-direction: column; align-items: center; }
  .speech-bubble::before { display: none; }
  .mascot-avatar { width: 64px; height: 64px; }
  .option-btn { padding: 12px 14px; font-size: 14px; }
  .btn-primary { padding: 12px 24px; font-size: 14px; }
}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-decoration" id="bgDeco"></div>
<!-- 彩纸 -->
<div class="confetti-container" id="confetti"></div>

<div class="app-container">
  <!-- 标题区 -->
  <div class="game-header">
    <h1 class="game-title">AI 提问大冒险</h1>
    <p class="game-subtitle">学会跟 AI 说话，成为提问高手！</p>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar">
    <div class="status-item">
      <div class="status-icon" style="background:var(--pink-light)">⭐</div>
      <span id="starCount">0 / 15</span>
    </div>
    <div class="exp-bar-wrap">
      <div class="exp-label"><span>经验值</span><span id="expText">0 / 500</span></div>
      <div class="exp-bar"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
    </div>
    <div class="status-item">
      <div class="level-badge" id="levelBadge">Lv.1 新手村</div>
    </div>
  </div>

  <!-- 关卡选择 -->
  <level-select id="levelSelect"></level-select>

  <!-- 游戏主区域 -->
  <game-area id="gameArea"></game-area>
</div>

<script>
// ============ 游戏数据 ============
const LEVELS = [
  {
    id: 1,
    name: '开始提问',
    icon: '🗣️',
    color: '#FF6B9D',
    colorLight: '#FFE0EB',
    desc: '学会把问题说清楚',
    mascotTheme: 'pink',
    scenario: {
      tag: '场景：你想让AI帮你写一篇作文',
      text: '老师布置了一篇作文题目叫《我的暑假》，你打开AI助手，想让它帮你写。'
    },
    questions: [
      {
        q: '你觉得下面哪种问法最好？为什么？',
        options: [
          { text: '"帮我写作文"', hint: '太笼统啦，AI不知道你要写啥样的作文' },
          { text: '"帮我写一篇《我的暑假》，要写去外婆家捉知了、学包饺子，大概400字，用小学生活泼的语气"', correct: true, hint: '完美！你说清楚了题目、内容、字数和语气' },
          { text: '"写暑假"', hint: '只有两个字，AI更懵了' },

let state = {
  totalExp: 0,
  stars: 0,
  completedLevels: [],
  levelStars: {},
  currentLevel: null,
  currentQuestionIndex: 0,
  questionStars: 0,
  unlockedLevels: [1]

function loadState() {
  try {
    const saved = localStorage.getItem('aiAdventureState');
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('aiAdventureState', JSON.stringify(state)); } catch(e) {}
}

// ============ SVG 吉祥物 ============
function getMascotSVG(theme, size) {
  const s = size || 80;
  const colors = {
    pink:   { main: '#FF6B9D', light: '#FFE0EB', dark: '#E74C8A', accent: '#FF85B3' },
    purple: { main: '#9B59B6', light: '#E8DAEF', dark: '#7D3C98', accent: '#BB77D4' },
    blue:   { main: '#5DADE2', light: '#D4E6F1', dark: '#2980B9', accent: '#85C9ED' },
    orange: { main: '#F39C12', light: '#FCF3CF', dark: '#D68910', accent: '#F5B54A' },
    green:  { main: '#58D68D', light: '#D5F5E3', dark: '#239B56', accent: '#82E0AA' }
  };
  const c = colors[theme] || colors.pink;

  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bodyGrad${theme}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:${c.light}"/>
        <stop offset="100%" style="stop-color:${c.main}"/>
      </linearGradient>
    </defs>
    <!-- 天线 -->
    <line x1="${s*0.5}" y1="${s*0.1}" x2="${s*0.5}" y2="${s*0.02}" stroke="${c.dark}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${s*0.5}" cy="${s*0.02}" r="${s*0.04}" fill="${c.accent}">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- 身体/头部 -->
    <rect x="${s*0.15}" y="${s*0.12}" width="${s*0.7}" height="${s*0.65}" rx="${s*0.2}" ry="${s*0.2}" fill="url(#bodyGrad${theme})" stroke="${c.dark}" stroke-width="2"/>
    <!-- 眼睛 -->
    <ellipse cx="${s*0.36}" cy="${s*0.4}" rx="${s*0.09}" ry="${s*0.11}" fill="white" stroke="${c.dark}" stroke-width="1.5"/>
    <ellipse cx="${s*0.64}" cy="${s*0.4}" rx="${s*0.09}" ry="${s*0.11}" fill="white" stroke="${c.dark}" stroke-width="1.5"/>
    <circle cx="${s*0.38}" cy="${s*0.41}" r="${s*0.045}" fill="#2C3E50">
      <animate attributeName="cx" values="${s*0.38};${s*0.4};${s*0.38}" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="${s*0.66}" cy="${s*0.41}" r="${s*0.045}" fill="#2C3E50">
      <animate attributeName="cx" values="${s*0.66};${s*0.68};${s*0.66}" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼睛高光 -->
    <circle cx="${s*0.4}" cy="${s*0.38}" r="${s*0.02}" fill="white"/>
    <circle cx="${s*0.68}" cy="${s*0.38}" r="${s*0.02}" fill="white"/>
    <!-- 腮红 -->
    <ellipse cx="${s*0.24}" cy="${s*0.52}" rx="${s*0.06}" ry="${s*0.03}" fill="${c.accent}" opacity="0.5"/>
    <ellipse cx="${s*0.76}" cy="${s*0.52}" rx="${s*0.06}" ry="${s*0.03}" fill="${c.accent}" opacity="0.5"/>
    <!-- 嘴巴 -->
    <path d="M${s*0.38} ${s*0.58} Q${s*0.5} ${s*0.68} ${s*0.62} ${s*0.58}" stroke="${c.dark}" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- 身体装饰 - 动漫风闪电/星星 -->
    <path d="M${s*0.5} ${s*0.72} L${s*0.46} ${s*0.82} L${s*0.54} ${s*0.78} L${s*0.5} ${s*0.88}" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
    <!-- 小手 -->
    <ellipse cx="${s*0.08}" cy="${s*0.55}" rx="${s*0.06}" ry="${s*0.1}" fill="${c.main}" stroke="${c.dark}" stroke-width="1.5"/>
    <ellipse cx="${s*0.92}" cy="${s*0.55}" rx="${s*0.06}" ry="${s*0.1}" fill="${c.main}" stroke="${c.dark}" stroke-width="1.5"/>
    <!-- 小脚 -->
    <ellipse cx="${s*0.32}" cy="${s*0.93}" rx="${s*0.1}" ry="${s*0.05}" fill="${c.dark}"/>
    <ellipse cx="${s*0.68}" cy="${s*0.93}" rx="${s*0.1}" ry="${s*0.05}" fill="${c.dark}"/>
  </svg>`;
}

  let html = '';
  for (let i = 0; i < 20; i++) {
    const sp = document.createElement('div');
    sp.className = 'star-particle';
    sp.style.left = Math.random() * 100 + '%';
    sp.style.top = Math.random() * 100 + '%';
    sp.style.animationDelay = Math.random() * 3 + 's';
    const colors = ['#FF6B9D','#9B59B6','#5DADE2','#F39C12','#58D68D'];
    sp.style.background = colors[i % 5];
    container.appendChild(sp);
  }
  for (let i = 0; i < 3; i++) {
    const cl = document.createElement('div');
    cl.className = 'cloud';
    cl.style.width = (150 + Math.random()*200) + 'px';
    cl.style.height = (40 + Math.random()*30) + 'px';
    cl.style.top = (Math.random()*60) + '%';
    cl.style.animationDelay = (i*7) + 's';
    cl.style.animationDuration = (18 + Math.random()*15) + 's';
    container.appendChild(cl);
  }
}

function renderLevelSelect() {
  const container = document.getElementById('levelSelect');
  let html = '';
  LEVELS.forEach(level => {
    const isUnlocked = state.unlockedLevels.includes(level.id);
    const isCompleted = state.completedLevels.includes(level.id);
    const isCurrent = !isCompleted && isUnlocked;
    const stars = state.levelStars[level.id] || 0;

    let cls = 'level-card';
    if (!isUnlocked) cls += ' locked';
    else if (isCompleted) cls += ' completed';
    else if (isCurrent) cls += ' current';

    html += `<div class="${cls}" onclick="${isUnlocked ? `startLevel(${level.id})` : ''}">
      <div class="level-num">${isCompleted ? '✓' : isUnlocked ? level.id : '🔒'}</div>
      <div class="level-name">${level.name}</div>
      ${isCompleted ? `<div class="level-star">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>` :
        !isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}
    </div>`;
  });
  container.innerHTML = html;
}

function updateStatus() {
  document.getElementById('starCount').textContent = `${state.stars} / 15`;
  document.getElementById('expText').textContent = `${state.totalExp} / 500`;
  document.getElementById('expFill').style.width = Math.min(state.totalExp / 5, 100) + '%';

  let titleObj = TITLES[0];
  for (const t of TITLES) {
    if (state.totalExp >= t.exp) titleObj = t;
  }
  document.getElementById('levelBadge').textContent = `Lv.${titleObj.level} ${titleObj.name}`;
}

function startLevel(levelId) {
  state.currentLevel = levelId;
  state.currentQuestionIndex = 0;
  state.questionStars = 0;
  saveState();
  renderLevelSelect();
  updateStatus();
  renderQuestion();
}

function renderQuestion() {
  const level = LEVELS.find(l => l.id === state.currentLevel);
  if (!level) return;
  const qi = state.currentQuestionIndex;

  if (qi >= level.questions.length) {
    showLevelComplete(level);
    return;
  }

  const question = level.questions[qi];
  const area = document.getElementById('gameArea');

  // 打乱选项顺序
  const shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);
  const letters = ['A','B','C','D'];

  let optionsHtml = '';
  shuffledOptions.forEach((opt, idx) => {
    optionsHtml += `<button class="option-btn" data-index="${idx}" onclick="selectOption(this, ${idx}, ${question.options.indexOf(opt)})">
      <span class="option-letter">${letters[idx]}</span>
      <span>${opt.text}</span>
    </button>`;
  });

  area.innerHTML = `
    <div class="character-section">
      <div class="mascot-avatar">${getMascotSVG(level.mascotTheme, 80)}</div>
      <div class="speech-bubble">
        第${qi+1}关 / 共${level.questions.length}关 — 加油！
      </div>
    </div>
    <div class="scene-card">
      <div class="scene-tag">${level.scenario.tag}</div>
      <div class="scene-text">${level.scenario.text}</div>
    </div>
    <div class="question-area">
      <div class="question-label">❓ 挑战题</div>
      <div class="question-text">${question.q}</div>
    </div>
    <div class="options-grid">${optionsHtml}</div>
    <div class="feedback-box" id="feedbackBox"></div>
  `;
}

function selectOption(btn, displayIdx, originalIdx) {
  const level = LEVELS.find(l => l.id === state.currentLevel);
  const question = level.questions[state.currentQuestionIndex];
  const option = question.options[originalIdx];
  const allBtns = document.querySelectorAll('.option-btn');

  allBtns.forEach(b => b.style.pointerEvents = 'none');

  const feedbackEl = document.getElementById('feedbackBox');
  feedbackEl.classList.add('show');

  if (option.correct) {
    btn.classList.add('selected-correct');
    feedbackEl.className = 'feedback-box show feedback-correct';
    feedbackEl.innerHTML = `<strong>🎉 太棒了！答对了！</strong><br/><br/>${question.explain}`;
    state.totalExp += question.expGain;
    state.stars++;
    state.questionStars++;
    state.levelStars[state.currentLevel] = state.questionStars;
    saveState();
    updateStatus();

    setTimeout(() => {
      state.currentQuestionIndex++;
      saveState();
      renderQuestion();
    }, 3500);
  } else {
    btn.classList.add('selected-wrong');
    feedbackEl.className = 'feedback-box show feedback-wrong';
    feedbackEl.innerHTML = `<strong>💪 差一点点！</strong><br/><br/>${option.hint}<br/><br/>再试一次吧！`;

    setTimeout(() => {
      allBtns.forEach((b, i) => {
        b.classList.remove('selected-wrong', 'selected-correct');
        b.style.pointerEvents = 'auto';
      });
      feedbackEl.classList.remove('show');
    }, 2500);
  }
}

function showLevelComplete(level) {
  const stars = state.levelStars[level.id] || 0;
  const area = document.getElementById('gameArea');

  if (!state.completedLevels.includes(level.id)) {
    state.completedLevels.push(level.id);
    if (state.currentLevel < LEVELS.length) {
      state.unlockedLevels.push(state.currentLevel + 1);
    }
    saveState();
  }

  renderLevelSelect();
  updateStatus();

  // 检查是否全部完成
  if (state.completedLevels.length >= LEVELS.length) {
    showAllClear();
    return;
  }

  area.innerHTML = `
    <div class="victory-screen show">
      <div class="victory-trophy">🏆</div>
      <div class="victory-title">"${level.name}" 通关！</div>
      <div class="victory-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <p class="victory-msg">你在这个关卡获得了 ${stars} 颗星星！<br/>学会了：${level.desc}</p>
      <div style="margin-bottom:16px">
        ${BADGES.filter(b=>b.levelId===level.id).map(b=`
          <div class="badge-item unlocked">
            <div class="badge-icon">${b.icon}</div>
            <div class="badge-name">${b.name}</div>
          </div>`).join('')}
      </div>
      <div class="action-row">
        <button class="btn-primary" onclick="startLevel(${Math.min(level.id+1,LEVELS.length)})">下一关 →</button>
        <button class="btn-secondary" onclick="showLevelSelect()">返回选关</button>
      </div>
    </div>`;

  if (stars === 3) fireConfetti(20);
}

function showAllClear() {
  const area = document.getElementById('gameArea');
  const level = LEVELS.find(l => l.id === state.currentLevel);

  area.innerHTML = `
    <div class="all-clear-screen show">
      <div class="final-mascot">${getMascotSVG('pink', 120)}</div>
      <div class="final-title">🎊 全部通关！🎊</div>
      <p class="final-message">
        太厉害了！你已经完成了所有 5 个关卡的挑战！<br/>
        你学会了：<br/>
        ✅ 把问题描述清楚<br/>
        ✅ 告诉AI你的背景<br/>
        ✅ 不满意就追问<br/>
        ✅ 用例子引导AI<br/>
        ✅ 检查AI说的对不对<br/><br/>
        现在，你已经是一个合格的 AI 提问高手啦！<br/>
        快去用真正的 AI 试一试吧！
      </p>
      <div class="badge-collection">
        ${BADGES.map(b => `
          <div class="badge-item unlocked">
            <div class="badge-icon">${b.icon}</div>
            <div class="badge-name">${b.name}</div>
          </div>`).join('')}
      </div>
      <div class="action-row" style="margin-top:24px">
        <button class="btn-primary" onclick="resetGame()">再玩一次 🔄</button>
      </div>
    </div>`;

  fireConfetti(80);
}

function showLevelSelect() {
  document.getElementById('gameArea').innerHTML = '';
  state.currentLevel = null;
  saveState();
  renderLevelSelect();
}

function resetGame() {
  state = {
    totalExp: 0, stars: 0, completedLevels: [],
    levelStars: {}, currentLevel: null,
    currentQuestionIndex: 0, questionStars: 0,
    unlockedLevels: [1]
  };
  saveState();
  updateStatus();
  renderLevelSelect();
  document.getElementById('gameArea').innerHTML = '';
}

// ============ 彩纸特效 ============
function fireConfetti(count) {
  const container = document.getElementById('confetti');
  container.classList.add('show');
  container.innerHTML = '';

  const colors = ['#FF6B9D','#9B59B6','#5DADE2','#F39C12','#58D68D','#FF85B3','#BB77D4','#E74C8A'];

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

    const shapes = ['50%', '2px', '30%'];
    piece.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];

    container.appendChild(piece);
  }

  setTimeout(() => container.classList.remove('show'), 4500);
}

// ============ 初始化 ============
loadState();
renderBackground();
renderLevelSelect();
updateStatus();

if (state.currentLevel) {
  renderQuestion();
}
</script>
</body>
</html>
